<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário elaborado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 500px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        fieldset {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #7d7d7d;
        }
        legend {
            font-size: 14px;
        }
        .campo {
            margin-bottom: 8px;
        }

        label {
            display: inline-block;
            width: 70px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 5px;
        }
        .botoes {
            margin-top: 15px;
        }
        button {
            padding: 4px 10px;
            margin-right: 10px;
            background-color: #f0f0f0;
            border: 1px solid #707070;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Formulário</h1>

    <form>
        <fieldset>
           <b> <legend>Dados pessoais</legend></b>
            
            <div class="campo">
                <b><label for="nome">Nome:</label></b>
                <input type="text" id="nome" name="nome" size="30">
            </div>
            
            <div class="campo">
                <b><label for="endereco">Endereço:</label></b>
                <input type="text" id="endereco" name="endereco" size="35">
            </div>
            
            <div class="campo">
                <b><label for="cidade">Cidade:</label></b>
                <input type="text" id="cidade" name="cidade" size="32">
            </div>
            
            <div class="campo">
                <b><label for="estado">Estado:</label></b>
                <select id="estado" name="estado">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
           <b> <legend>Dados profissionais</legend></b>
            
            <b><p>Natureza do Cargo</p></b>
            <b><input type="radio" name="cargo" value="gerencia" checked> Gerência</b>
            <b><input type="radio" name="cargo" value="financeiro"> Financeiro</b>
            <b><input type="radio" name="cargo" value="recepcao"> Recepção</b>
            <b><input type="radio" name="cargo" value="administrativo"> Administrativo</b>
            <b><input type="radio" name="cargo" value="juridico"> Jurídico</b>
            
            <br><br>
            
            <b><p>Área de interesse</p></b>
            <b><input type="checkbox" name="interesse" value="computacao"> Computação</b>
            <b><input type="checkbox" name="interesse" value="biologia"> Biologia</b>
            <b><input type="checkbox" name="interesse" value="meio_ambiente"> Meio Ambiente</b>
            <b><input type="checkbox" name="interesse" value="engenharia"> Engenharia</b>
            <b><input type="checkbox" name="interesse" value="historia"> História</b>

            <br><br>
            
            <b><label for="curriculo">Mini-currículo:</label></b>
            <textarea id="curriculo" name="curriculo"></textarea>
        </fieldset>

        
        <div class="botoes">
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>
    </form>

</body>
</html>
